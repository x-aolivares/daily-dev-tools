[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-dev-tools"
version = "1.0.0"
description = "Shortcuts del día a día para Git Bash: gfp, gcp, y los tuyos"
readme = "README.md"
requires-python = ">=3.14"
dynamic = ["dependencies", "optional-dependencies"]
license = { text = "MIT" }
authors = [{ name = "Alessandro Olivares" }]
keywords = ["git", "shortcuts", "cli", "git-bash"]

[project.scripts]
ddt = "daily_dev_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_dev_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.dynamic]
dependencies = {file = ["docs/requirements.txt"]}